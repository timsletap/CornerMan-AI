[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
