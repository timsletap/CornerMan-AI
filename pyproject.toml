[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "."]
extend-exclude = ["backend/alembic/versions"]  # autogenerated

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is enforced by `ruff format`; long string literals are left alone.
# UP042: str+Enum -> StrEnum changes str() output, which would alter stored/serialized values.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # backend/alembic/ is migrations, not the package

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in default arguments.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
