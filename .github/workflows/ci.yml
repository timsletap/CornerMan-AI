name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cornerman
          POSTGRES_PASSWORD: cornerman
          POSTGRES_DB: cornerman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cornerman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cornerman:cornerman@localhost:5432/cornerman_test
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu  # CPU torch: much smaller than the CUDA wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint and type check
        run: make lint-backend typecheck-backend PY=python
      - name: Test
        run: make test-backend PY=python

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
